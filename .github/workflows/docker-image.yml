name: Build and Push redroid-rk3588-nogapps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push (ARM64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true

          # ✅ 专属缓存作用域：防止与你其他项目的缓存发生冲突或交叉污染
          cache-from: type=gha,scope=redroid-rk3588-nogapps
          cache-to: type=gha,mode=max,scope=redroid-rk3588-nogapps

          # ✅ 语义化多标签策略
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/redroid-rk3588-nogapps:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/redroid-rk3588-nogapps:v1.1
            ${{ secrets.DOCKERHUB_USERNAME }}/redroid-rk3588-nogapps:${{ github.sha }}

          # ✅ 构建优化（禁用不必要的 metadata 声明，加快构建）
          provenance: false

